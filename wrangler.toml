name = "floofytech-elk"

# :schema node_modules/wrangler/config-schema.json
main = ".output/server/index.mjs"
compatibility_date = "2026-06-06"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false

# Serve static assets generated by Nuxt
[assets]
directory = ".output/public"

[vars]
NUXT_DEPLOY_URL = "elk.floofy.tech"
NUXT_PUBLIC_DEFAULT_SERVER = "floofy.tech"
NUXT_STORAGE_DRIVER = "cloudflare-kv-binding"
VITE_DEV_PWA = "true"

[[kv_namespaces]]
binding = "STORAGE"
id = "ac8ec2b2bb434d4bbbe7dda823feb3ab"

[[routes]]
pattern = "elk.floofy.tech"
custom_domain = true
